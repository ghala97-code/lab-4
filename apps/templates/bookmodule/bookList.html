{% extends "layouts/base.html" %}

{% block title %} Book List {% endblock title %}

{% block content %}
    <h2>Search Results</h2>
    {% for obj in books %}
        ID: {{obj.id}}, Title: {{obj.title}}
        <hr>
    {% empty %}
        <p>No results found matching your query.</p>
    {% endfor %}
{% endblock content %}
