<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab 12</title>
</head>
<body>

    <nav>
        {% if user.is_authenticated %}
            <span>Welcome, <strong>{{ user.username }}</strong>!</span> | 
            <a href="{% url 'logout' %}">Logout</a> {% else %}
            <a href="{% url 'login' %}">Login</a> | 
            <a href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
    <hr>

    {% if messages %}
        <div style="padding: 10px; margin-bottom: 15px;">
            {% for message in messages %}
                <p class="{% if message.tags == 'success' %}success-msg{% else %}error-msg{% endif %}" style="font-weight: bold;">
                    {{ message }}
                </p>
            {% endfor %}
        </div>
    {% endif %}

    <div>
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
